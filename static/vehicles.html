<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WTStat · 载具资料表</title>
<style>
@font-face{font-family:WTSymbols;src:url('/fonts/wt-symbols.ttf') format('truetype');font-display:swap}.vehicle-name{font-family:WTSymbols,"Segoe UI","Microsoft YaHei",sans-serif}
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#e9edf2;background:#10141b}*{box-sizing:border-box}body{margin:0}
header{padding:20px max(24px,calc((100vw - 1400px)/2));background:#171e28;border-bottom:1px solid #334151}h1{font-size:25px;margin:0 0 12px}a{color:#8bc5ff}.return-link{display:inline-flex;align-items:center;padding:11px 17px;border-radius:8px;background:#f2b84b;color:#17202a;text-decoration:none;font-weight:700;box-shadow:0 2px 8px #0005}.return-link:hover,.return-link:focus-visible{background:#ffd47c;color:#101820;outline:2px solid #fff;outline-offset:2px}main{max-width:1400px;margin:auto;padding:24px}.muted{color:#acbbc9;font-size:13px}.error{color:#ff9c91}
.panel{background:#1b2430;border:1px solid #344456;border-radius:12px;padding:18px;margin-bottom:16px}.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}label{font-size:13px;color:#b9c7d3;display:grid;gap:5px}input,select{min-width:140px;padding:10px;color:#f3f6fa;background:#111821;border:1px solid #435366;border-radius:7px;font:inherit}input{min-width:260px}button{background:#f2b84b;color:#17202a;border:0;border-radius:7px;padding:11px 17px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1120px;font-size:13px}th,td{padding:9px 8px;border-bottom:1px solid #354557;text-align:left;white-space:nowrap}th{background:#263242;position:sticky;top:0}tr:hover td{background:#202d39}.br-sort{background:transparent;color:#e9edf2;padding:5px 4px;border-radius:5px;font-size:13px;white-space:nowrap}.br-sort:hover,.br-sort:focus-visible{background:#425a72;color:#fff;outline:2px solid #8bc5ff;outline-offset:1px}.sort-indicator{color:#f2b84b}th[aria-sort="ascending"] .br-sort,th[aria-sort="descending"] .br-sort{color:#ffe19a}.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}.pager button{padding:8px 13px}@media(max-width:700px){main{padding:12px}.filters label,.filters input,.filters select{width:100%}}
</style></head><body>
<header><h1>War Thunder Wiki 载具资料表</h1><a id="returnLink" class="return-link" href="/">← 返回对局查询</a></header>
<main><div class="panel"><form id="filters" class="filters" autocomplete="off"><label>名称或内部代码<input id="q" autocomplete="off" placeholder="例如 F18、F14D 或 f_14d"></label><label>分类<select id="category"><option value="">全部</option><option value="aviation">航空</option><option value="helicopters">直升机</option><option value="ground">陆战</option><option value="ships">远洋舰船</option><option value="boats">近海舰艇</option></select></label><label>所属科技树<select id="country"><option value="">全部</option><option value="usa">美国</option><option value="germany">德国</option><option value="ussr">苏联</option><option value="britain">英国</option><option value="japan">日本</option><option value="china">中国</option><option value="italy">意大利</option><option value="france">法国</option><option value="sweden">瑞典</option><option value="israel">以色列</option></select></label><button type="submit">查询</button></form><p class="muted">载具类型直接采用官方 Wiki 的 Roles 字段（如 Medium tank、SPAA、Fighter）；它不细分所有现实设计类别。现实所属国采用 Wiki 的 Operator 字段。AB＝街机，RB＝历史，SB＝全真；前三列是对应分类的权重，航空载具即空战权重。后两列“飞机陆战 RB/SB”仅适用于飞机参加陆战时；未提供的值显示 —。点击权重表头排序，再点切换升降序。</p><div class="actions"><a href="/api/vehicles.csv" download>下载完整 CSV</a><span id="status" class="muted">正在读取本地资料表…</span></div></div>
<div class="panel scroll"><table><thead><tr><th>载具名称</th><th>内部代码</th><th>分类</th><th>Wiki 类型</th><th>科技树</th><th>现实所属国</th><th data-br-sort="br_ab" aria-sort="none"><button class="br-sort" type="button" data-sort="br_ab">AB<span class="sort-indicator"> ↕</span></button></th><th data-br-sort="br_rb" aria-sort="none"><button class="br-sort" type="button" data-sort="br_rb">RB<span class="sort-indicator"> ↕</span></button></th><th data-br-sort="br_sb" aria-sort="none"><button class="br-sort" type="button" data-sort="br_sb">SB<span class="sort-indicator"> ↕</span></button></th><th data-br-sort="br_ground_rb" aria-sort="none"><button class="br-sort" type="button" data-sort="br_ground_rb" title="飞机参加陆战时的历史权重">飞机陆战 RB<span class="sort-indicator"> ↕</span></button></th><th data-br-sort="br_ground_sb" aria-sort="none"><button class="br-sort" type="button" data-sort="br_ground_sb" title="飞机参加陆战时的全真权重">飞机陆战 SB<span class="sort-indicator"> ↕</span></button></th><th>来源</th></tr></thead><tbody id="rows"></tbody></table><div class="pager"><button id="prev" type="button">上一页</button><span id="range" class="muted"></span><button id="next" type="button">下一页</button></div></div></main>
<script>
const $=s=>document.querySelector(s),e=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const br=v=>v===null||v===undefined||v===''||!Number.isFinite(Number(v))?'—':Number(v).toFixed(1);
const categoryNames={aviation:'航空',helicopters:'直升机',ground:'陆战',ships:'远洋舰船',boats:'近海舰艇'};
let offset=0,next=null,busy=false,sort='',direction='desc';const limit=100;const pageParams=new URLSearchParams(location.search);let exactId=pageParams.get('id')||'';const returnSession=pageParams.get('session')||'';if(/^[0-9a-fA-F]{16}$/.test(returnSession)){const back=new URLSearchParams({session:returnSession});for(const key of ['q','start','end'])if(pageParams.get(key))back.set(key,pageParams.get(key));$('#returnLink').href='/?'+back;$('#returnLink').textContent='← 返回刚才的对局' }
function updateSortHeaders(){document.querySelectorAll('th[data-br-sort]').forEach(th=>{const active=th.dataset.brSort===sort;th.setAttribute('aria-sort',active?(direction==='asc'?'ascending':'descending'):'none');th.querySelector('.sort-indicator').textContent=active?(direction==='asc'?' ↑':' ↓'):' ↕'})}
async function load(){if(busy)return;busy=true;$('#status').textContent='读取中…';try{const params=new URLSearchParams({q:$('#q').value.trim(),category:$('#category').value,country:$('#country').value,offset,limit});if(exactId)params.set('vehicle_id',exactId);if(sort){params.set('sort',sort);params.set('direction',direction)}const response=await fetch('/api/vehicles?'+params);const data=await response.json();if(!response.ok)throw Error(data.detail||`HTTP ${response.status}`);$('#rows').innerHTML=data.items.map(x=>`<tr><td class="vehicle-name">${e(x.name)}</td><td>${e(x.vehicle_id)}</td><td>${e(categoryNames[x.category])}</td><td>${e(x.vehicle_role)}</td><td>${e(x.research_country)}</td><td>${e(x.operator_country)}</td><td>${br(x.br_ab)}</td><td>${br(x.br_rb)}</td><td>${br(x.br_sb)}</td><td>${br(x.br_ground_rb)}</td><td>${br(x.br_ground_sb)}</td><td><a href="${e(x.source_url)}" target="_blank" rel="noopener">Wiki</a></td></tr>`).join('');next=data.next_offset;$('#range').textContent=`${data.total?offset+1:0}–${offset+data.items.length} / ${data.total}`;$('#prev').disabled=offset===0;$('#next').disabled=next===null;$('#status').textContent=`本地资料：${data.total} 辆/架`;}catch(error){$('#status').textContent=error.message;$('#status').className='error';$('#rows').replaceChildren()}finally{busy=false}}
$('#filters').onsubmit=event=>{event.preventDefault();exactId='';offset=0;load()};$('#category').onchange=()=>{exactId='';offset=0;load()};$('#country').onchange=()=>{exactId='';offset=0;load()};document.querySelectorAll('.br-sort').forEach(button=>button.onclick=()=>{if(busy)return;direction=sort===button.dataset.sort?(direction==='desc'?'asc':'desc'):'desc';sort=button.dataset.sort;offset=0;updateSortHeaders();load()});$('#prev').onclick=()=>{offset=Math.max(0,offset-limit);load()};$('#next').onclick=()=>{if(next!==null){offset=next;load()}};$('#q').value=exactId||new URLSearchParams(location.search).get('q')||'';load();
</script></body></html>
