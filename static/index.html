<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WTStat · 战争雷霆对局查询</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#e9edf2;background:#10141b}*{box-sizing:border-box}
body{margin:0}header{background:#171e28;border-bottom:1px solid #334151;padding:20px max(24px,calc((100vw - 1180px)/2))}h1{margin:0;font-size:26px;letter-spacing:.3px}header p{color:#aeb9c6;margin:7px 0 0;font-size:14px}
main{max-width:1180px;margin:auto;padding:24px}section{background:#1b2430;border:1px solid #344456;border-radius:12px;padding:20px;margin-bottom:20px}h2{margin:0 0 14px;font-size:19px}
.form{display:grid;grid-template-columns:minmax(220px,2fr) 160px 160px auto;gap:10px;align-items:end}label{display:block;color:#aeb9c6;font-size:13px;margin-bottom:5px}input{width:100%;background:#111821;color:#f5f7fa;border:1px solid #435366;border-radius:7px;padding:11px;font:inherit}button{background:#f2b84b;color:#17202a;border:0;border-radius:7px;padding:12px 19px;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#ffd076}button:disabled{opacity:.55;cursor:default}.muted{color:#aeb9c6;font-size:13px}.error{color:#ff9c91}.notice{color:#b9d7ff}.hidden{display:none}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.list{display:grid;gap:9px}.match{width:100%;display:grid;grid-template-columns:180px 1fr auto;gap:16px;text-align:left;align-items:center;background:#202d3b;border:1px solid #405063;color:#eef2f6;border-radius:8px;padding:14px;cursor:pointer}.match:hover{border-color:#f2b84b}.tag{color:#f2b84b;font-size:13px}.small{font-size:12px;color:#aeb9c6}.team{overflow-x:auto;margin-top:18px}.team-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.team-sort{display:flex;align-items:center;gap:7px;color:#b6c4d1;font-size:13px}.team-sort select{background:#111821;color:#f5f7fa;border:1px solid #435366;border-radius:7px;padding:7px;font:inherit}h3{margin:14px 0 9px}table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}th,td{padding:9px 8px;border-bottom:1px solid #354557;text-align:left;vertical-align:top}th{color:#b6c4d1;font-weight:600;background:#263242}tr:hover td{background:#202d39}.pill{display:inline-block;background:#34485d;border-radius:5px;padding:3px 6px;margin:2px 4px 2px 0}.stats{font-variant-numeric:tabular-nums}.back{background:#39495b;color:#fff}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}.meta div{background:#15202b;padding:10px;border-radius:7px}.meta strong{display:block;color:#b8c9d9;font-size:12px;margin-bottom:4px}a{color:#85c1ff}#more{margin-top:15px}@media(max-width:720px){main{padding:14px}header{padding:16px}.form{grid-template-columns:1fr 1fr}.form>div:first-child{grid-column:1/-1}.form button{grid-column:1/-1}.match{grid-template-columns:1fr}.row{align-items:flex-start}}
@font-face{font-family:WTSymbols;src:url('/fonts/wt-symbols.ttf') format('truetype');font-display:swap}.pill{font-family:WTSymbols,Inter,"Segoe UI","Microsoft YaHei",sans-serif}
.sort-button{background:transparent;color:inherit;border:0;border-radius:4px;padding:3px 5px;font:inherit;font-weight:inherit;cursor:pointer}.sort-button:hover,.sort-button:focus-visible{background:#34485d;color:#ffe0a3}.sort-indicator{color:#f2b84b}
.player-id{border-bottom:1px dotted #8ea6bd;cursor:help}
.country-flag{display:inline-block;width:27px;height:20px;object-fit:contain;vertical-align:middle;border:1px solid #8291a0;border-radius:2px}
.pill{color:#eef2f6;text-decoration:none}.pill:hover{background:#45617a;text-decoration:underline}
</style></head><body>
<header><h1>WTStat</h1><p>War Thunder Replay · 本地战绩查询 · <a href="/vehicles">载具资料表</a></p></header>
<main><section id="searchPanel"><h2>查询对局</h2><form id="searchForm" class="form"><div><label for="q">玩家昵称 / UID / Session ID</label><input id="q" required placeholder="输入昵称、UID 或 Session ID" autocomplete="off"></div><div><label for="start">开始日期 (UTC，可留空)</label><input id="start" type="date"></div><div><label for="end">结束日期 (UTC，可留空)</label><input id="end" type="date"></div><button type="submit">查询</button></form><p class="muted" id="status">正在检查配置…</p></section>
<section id="results"><div class="row"><h2>对局列表</h2><span class="muted" id="listInfo">默认显示最近 15 场</span></div><div id="message" class="muted">输入玩家昵称开始搜索；也可直接输入 Session ID 查看一场对局。</div><div id="matches" class="list"></div><button id="more" class="hidden" type="button">加载更多</button></section>
<section id="detail" class="hidden"><div class="row"><h2>对局详情</h2><button type="button" class="back" id="back">返回列表</button></div><div id="detailBody"></div></section></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'N/A').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v=x=>x===null||x===undefined||x===''?'N/A':esc(x);
let query='',offset=0,next=null,loading=false,activeSession=null,loadedMatches=[];
async function api(url){const r=await fetch(url);let data;try{data=await r.json()}catch{throw Error('服务器响应格式错误')}if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:`HTTP ${r.status}`);return data}
async function check(){try{const d=await api('/api/status');$('#status').textContent=d.cookie_configured?'Cookie 已配置，可搜索昵称。输入 Session ID 无需 Cookie。':'昵称搜索需要 identity_sid；按 README 配置本地 Cookie。Session ID 可匿名查询。'}catch(e){$('#status').textContent=e.message}}
function setMessage(t,kind='muted'){$('#message').className=kind;$('#message').textContent=t}
function renderMatch(m){const b=document.createElement('button');b.type='button';b.className='match';b.innerHTML=`<span>${v(m.date_text)}<br><span class="small">官网时间 · UTC</span></span><span><b>${v(m.map||m.title)}</b><br><span class="small">${v(m.game_type)} · ${v(m.game_mode)} · ${v(m.duration)}</span></span><span class="tag">查看详情 →</span>`;b.onclick=()=>{saveListState(m.sid);showDetail(m.sid)};$('#matches').appendChild(b)}
function saveListState(sid){if(!query||!loadedMatches.length)return;try{sessionStorage.setItem('wtstat-list',JSON.stringify({sid,query,start:$('#start').value,end:$('#end').value,items:loadedMatches,offset,next,listInfo:$('#listInfo').textContent,message:$('#message').textContent,messageClass:$('#message').className}))}catch{}}
function restoreListState(sid){try{const state=JSON.parse(sessionStorage.getItem('wtstat-list')||'null');if(state?.sid!==sid||!state.query||!Array.isArray(state.items))return false;query=state.query;$('#q').value=query;$('#start').value=state.start||'';$('#end').value=state.end||'';loadedMatches=state.items;$('#matches').replaceChildren();loadedMatches.forEach(renderMatch);offset=state.offset||0;next=state.next??null;$('#more').classList.toggle('hidden',next===null);$('#listInfo').textContent=state.listInfo||'';$('#message').textContent=state.message||'';$('#message').className=state.messageClass||'muted';return true}catch{return false}}
async function load(reset=false){if(loading)return;loading=true;const button=$('#more');button.disabled=true;if(reset){offset=0;next=null;loadedMatches=[];$('#matches').replaceChildren();setMessage('正在读取官网列表…','notice')}try{const params=new URLSearchParams({q:query,offset});if($('#start').value)params.set('start',$('#start').value);if($('#end').value)params.set('end',$('#end').value);const d=await api('/api/search?'+params);if(d.mode!=='session'&&typeof d.total!=='number')throw Error('当前连接的是旧版 WTStat 服务。请运行更新后的 start.bat，并打开 http://127.0.0.1:8766');loadedMatches.push(...d.items);d.items.forEach(renderMatch);next=d.next_offset;button.classList.toggle('hidden',next===null);const shown=$('#matches').children.length,filtered=$('#start').value||$('#end').value;$('#listInfo').textContent=`已显示 ${shown} 场${d.total===undefined?'':` · 官网共 ${d.total} 场`}`;setMessage(d.items.length?d.note||'':d.total&&filtered?'官网有对局，但当前日期筛选没有命中这一页。请清空日期后查询，或继续加载更多。':(next===null?'没有找到对局。':'这一页没有对局，可继续加载。'));offset=next??offset}catch(e){setMessage(e.message,'error');button.classList.add('hidden')}finally{button.disabled=false;loading=false}}
function vehicleHref(code){const params=new URLSearchParams({id:code});if(activeSession)params.set('session',activeSession);if(query)params.set('q',query);if($('#start').value)params.set('start',$('#start').value);if($('#end').value)params.set('end',$('#end').value);return '/vehicles?'+params}
function vehicleCells(items){return items?.length?items.map(x=>x.code?`<a class="pill" href="${esc(vehicleHref(x.code))}" title="查看载具资料">${esc(x.name)}</a>`:`<span class="pill">${esc(x.name)}</span>`).join(''):'N/A'}
function lineupCountry(player){const countries=[...new Set((player.configured||[]).map(x=>x.country).filter(x=>x&&x!=='N/A'))];return countries.length===1?countries[0]:null}
const FLAG_CODES={'美国':'us','德国':'de','苏联':'su','英国':'gb','日本':'jp','意大利':'it','法国':'fr','瑞典':'se','中国':'cn','以色列':'il'};
function countryFlag(player){const country=lineupCountry(player),code=FLAG_CODES[country];return code?`<img class="country-flag" src="/flags/${code}.svg" alt="${esc(country)}" title="${esc(country)}">`:v(country)}
function aiDisplay(p){const values=[p.aiKills,p.aiGroundKills,p.aiNavalKills];if(values.some(x=>x===null||x===undefined||x===''))return 'AI N/A';const counts=values.map(Number);if(counts.some(x=>!Number.isFinite(x)))return 'AI N/A';const total=counts.reduce((a,b)=>a+b,0),parts=['空中','地面','海上'].map((name,i)=>counts[i]>0?`${name} ${counts[i]}`:null).filter(Boolean);return `AI ${total}${parts.length?`（${parts.join(' · ')}）`:''}`}
function sortPlayers(players,key,direction){if(!key)return players;return players.map((player,index)=>({player,index})).sort((a,b)=>{if(key==='country'){const ac=lineupCountry(a.player),bc=lineupCountry(b.player);if(!ac||!bc)return ac? -1:bc?1:a.index-b.index;return ac.localeCompare(bc,'zh-CN')*direction||a.index-b.index}const av=Number(a.player[key]),bv=Number(b.player[key]);const am=a.player[key]===null||a.player[key]===undefined||!Number.isFinite(av),bm=b.player[key]===null||b.player[key]===undefined||!Number.isFinite(bv);if(am!==bm)return am?1:-1;return (am?0:(av-bv)*direction)||a.index-b.index}).map(x=>x.player)}
function playerRows(players){return players.map(p=>`<tr><td><span class="player-id" title="UID：${v(p.uid)}">${v(p.name)}</span></td><td>${countryFlag(p)}</td><td>${vehicleCells(p.configured)}</td><td class="stats">${v(p.kills)}</td><td class="stats">${v(p.groundKills)}</td><td class="stats">${v(p.deaths)}</td><td class="stats">${v(p.assists)}</td><td class="stats">${v(p.score)}</td><td class="small">${aiDisplay(p)} · 占点 ${v(p.captureZone)} · 队友击杀 ${v(p.teamKills)}</td></tr>`).join('')}
function table(team,players,index){const sortHead=(key,label)=>`<th data-stat="${key}" aria-sort="none"><button type="button" class="sort-button" data-team-index="${index}" data-sort-key="${key}" title="点击排序，再次点击切换方向">${label}<span class="sort-indicator"></span></button></th>`;return `<div class="team"><h3>队伍 ${esc(team)} · ${players.length} 人</h3><table><thead><tr><th>玩家</th>${sortHead('country','队列国籍')}<th>载具</th>${sortHead('kills','空中击杀')}${sortHead('groundKills','地面击杀')}${sortHead('deaths','死亡')}${sortHead('assists','助攻')}${sortHead('score','得分')}<th>其他</th></tr></thead><tbody id="team-rows-${index}">${playerRows(players)}</tbody></table></div>`}
async function showDetail(sid){activeSession=sid;$('#results').classList.add('hidden');$('#detail').classList.remove('hidden');$('#detailBody').innerHTML='<p class="notice">正在按需读取对局详情；首次下载可能需要一些时间…</p>';try{const d=await api('/api/detail/'+encodeURIComponent(sid));const teams=[...new Set(d.players.map(p=>p.team))].sort();const groups=teams.map(t=>d.players.filter(p=>p.team===t));$('#detailBody').innerHTML=`<div class="meta"><div><strong>开始时间 (UTC)</strong>${v(d.start_utc)}</div><div><strong>地图</strong>${v(d.map||d.level)}</div><div><strong>Session ID</strong>${esc(d.sid)}</div><div><strong>数据来源</strong>${v(d.source)} · ${v(d.parts)} 段</div></div><p class="muted"><a href="https://warthunder.com/en/tournament/replay/${BigInt('0x'+d.sid)}" target="_blank" rel="noopener">官网对局页</a></p>${teams.map((t,i)=>table(t,groups[i],i)).join('')}`;const sortStates=groups.map(()=>({key:null,direction:-1}));$('#detailBody').querySelectorAll('.sort-button').forEach(button=>{button.onclick=()=>{const i=Number(button.dataset.teamIndex),key=button.dataset.sortKey,state=sortStates[i];state.direction=state.key===key?-state.direction:(key==='country'?1:-1);state.key=key;$(`#team-rows-${i}`).innerHTML=playerRows(sortPlayers(groups[i],key,state.direction));button.closest('thead').querySelectorAll('th[data-stat]').forEach(th=>{const active=th.dataset.stat===key;th.setAttribute('aria-sort',active?(state.direction<0?'descending':'ascending'):'none');th.querySelector('.sort-indicator').textContent=active?(state.direction<0?' ↓':' ↑'):''})}})}catch(e){$('#detailBody').innerHTML=`<p class="error">${esc(e.message)}</p>`}}
$('#searchForm').onsubmit=e=>{e.preventDefault();query=$('#q').value.trim();$('#detail').classList.add('hidden');$('#results').classList.remove('hidden');load(true)};
$('#more').onclick=()=>load(false);$('#back').onclick=()=>{$('#detail').classList.add('hidden');$('#results').classList.remove('hidden')};check();const pageParams=new URLSearchParams(location.search),returnSession=pageParams.get('session');if(returnSession&&/^[0-9a-fA-F]{16}$/.test(returnSession)){if(!restoreListState(returnSession)){query=pageParams.get('q')||returnSession;$('#q').value=query;$('#start').value=pageParams.get('start')||'';$('#end').value=pageParams.get('end')||'';load(true)}showDetail(returnSession)}
</script></body></html>
