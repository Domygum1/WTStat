<header><h1>WTStat</h1><p>War Thunder Replay · 本地战绩查询 · <a href="/stats">统计</a> · <a href="/vehicles">载具资料表</a></p></header>
<main><section id="searchPanel"><h2>查询对局</h2><form id="searchForm" class="form"><div><label for="q">玩家昵称 / UID / Session ID</label><input id="q" required placeholder="输入昵称、UID 或 Session ID" autocomplete="off"></div><div><label for="start">开始日期 (UTC，可留空)</label><input id="start" type="date"></div><div><label for="end">结束日期 (UTC，可留空)</label><input id="end" type="date"></div><button type="submit">查询</button></form><p class="muted" id="status">正在检查配置…</p><div class="saved-panel"><div class="saved-column"><div class="saved-heading"><strong>最近查询</strong><small>最多 5 位玩家</small></div><div id="recentList" class="saved-list"></div></div><div class="saved-column"><div class="saved-heading"><strong>已关注</strong><small>长期保留</small></div><div id="favoriteList" class="saved-list"></div></div><p id="savedStatus" class="saved-status muted" aria-live="polite"></p></div></section>
<section id="cachePanel"><div class="cache-toolbar"><button id="showCache" class="cache-toggle" type="button" aria-expanded="false" aria-controls="cacheContents">显示已缓存战局</button><span id="cacheCount" class="muted"></span></div><div id="cacheContents" class="hidden"><div class="cache-toolbar" style="margin-top:18px"><h2>已缓存战局</h2><div class="cache-bulk-actions"><label class="cache-select-label" title="选择当前筛选结果"><input id="cacheSelectAll" type="checkbox">全选</label><button id="deleteSelectedCache" class="cache-clear-all" type="button" title="删除勾选的战局缓存" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg>删除选择战局</button></div></div><div class="cache-filter"><label for="cacheLevel">缓存状态<select id="cacheLevel"><option value="">全部</option><option value="complete">完全缓存</option><option value="partial">部分缓存</option></select></label></div><p id="cachePanelStatus" class="muted" aria-live="polite"></p><div id="cachedMatches" class="list cached-list"></div></div></section>
<section id="results"><div class="row"><h2>对局列表</h2><div class="list-heading-actions"><span class="muted" id="listInfo">默认显示最近 15 场</span></div></div><div class="match-filters"><label for="battleType">对局类型<select id="battleType"><option value="">全部</option><option value="air">空战</option><option value="ground">陆战</option><option value="naval">海战</option></select></label><label for="battleMode">模式<select id="battleMode"><option value="">全部</option><option value="arcade">街机</option><option value="realistic">历史</option><option value="simulation">全真</option></select></label></div><p id="filterNote" class="muted"></p><div id="message" class="muted">输入玩家昵称开始搜索；也可直接输入 Session ID 查看一场对局。</div><div id="matches" class="list"></div><p id="cacheStatus" class="muted" aria-live="polite"></p><button id="more" class="hidden" type="button">加载更多</button></section>
<section id="detail" class="hidden"><div class="row"><h2>对局详情</h2><div class="detail-actions"><button type="button" class="back hidden" id="saveBattleImage">保存战局图片</button><button type="button" class="back" id="back">返回列表</button></div></div><p id="imageStatus" class="muted" aria-live="polite"></p><div id="detailBody"></div></section></main>
<script>
(function () {
  'use strict';

  const WIDTH = 2400;
  const MARGIN = 44;
  const GAP = 24;
  const PANEL_WIDTH = (WIDTH - MARGIN * 2 - GAP) / 2;
  const FONT = '"Microsoft YaHei", "Segoe UI", sans-serif';
  const COLORS = {
    background: '#101821', panel: '#1b2836', card: '#162330', line: '#34485c',
    text: '#eef4fa', muted: '#b2c4d3', blue: '#91c7f4', red: '#f2a6a5',
    gold: '#ffd17d', highlight: '#344337', highlightLine: '#e8c365',
  };

  function value(item) {
    return item === null || item === undefined || item === '' ? 'N/A' : String(item);
  }

  function rating(item) {
    const number = Number(item);
    return item === null || item === undefined || !Number.isFinite(number) ? 'N/A' : number.toFixed(1);
  }

  function country(player) {
    const countries = [...new Set((player.configured || []).map(item => item.country).filter(item => item && item !== 'N/A'))];
    return countries.length === 1 ? countries[0] : 'N/A';
  }

  function aiText(player) {
    const fields = [player.aiKills, player.aiGroundKills, player.aiNavalKills];
    if (fields.some(item => item === null || item === undefined || item === '' || !Number.isFinite(Number(item)))) return 'AI N/A';
    const counts = fields.map(Number);
    const parts = ['空中', '地面', '海上'].map((label, index) => counts[index] ? `${label} ${counts[index]}` : '').filter(Boolean);
    return `AI ${counts.reduce((sum, count) => sum + count, 0)}${parts.length ? `（${parts.join(' · ')}）` : ''}`;
  }

  function roundRect(ctx, x, y, width, height, radius, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + width, y, x + width, y + height, radius);
    ctx.arcTo(x + width, y + height, x, y + height, radius);
    ctx.arcTo(x, y + height, x, y, radius);
    ctx.arcTo(x, y, x + width, y, radius);
    ctx.closePath();
    ctx.fill();
  }

  function wrap(ctx, text, maxWidth) {
    const lines = [];
    for (const paragraph of String(text).split('\n')) {
      let line = '';
      for (const char of paragraph) {
        if (line && ctx.measureText(line + char).width > maxWidth) {
          lines.push(line);
          line = char;
        } else {
          line += char;
        }
      }
      lines.push(line || ' ');
    }
    return lines;
  }

  function drawLines(ctx, lines, x, y, lineHeight, color) {
    ctx.fillStyle = color;
    for (const line of lines) {
      ctx.fillText(line, x, y);
      y += lineHeight;
    }
    return y;
  }

  function playerLayout(ctx, player) {
    const contentWidth = PANEL_WIDTH - 64;
    ctx.font = `700 22px ${FONT}`;
    const name = wrap(ctx, `${value(player.name)}  ·  ${country(player)}`, contentWidth - 145);
    ctx.font = `19px ${FONT}`;
    const vehicles = wrap(ctx, `载具  ${(player.configured || []).map(item => value(item.name)).join(' · ') || 'N/A'}`, contentWidth);
    ctx.font = `18px ${FONT}`;
    const stats = wrap(ctx, `空中击杀 ${value(player.kills)}   地面击杀 ${value(player.groundKills)}   死亡 ${value(player.deaths)}   助攻 ${value(player.assists)}   得分 ${value(player.score)}`, contentWidth);
    ctx.font = `17px ${FONT}`;
    const other = wrap(ctx, `UID ${value(player.uid)}   ·   ${aiText(player)}   ·   占点 ${value(player.captureZone)}   ·   击杀队友 ${value(player.teamKills)}`, contentWidth);
    const height = 20 + name.length * 29 + 7 + vehicles.length * 25 + 7 + stats.length * 24 + 5 + other.length * 23 + 17;
    return { player, name, vehicles, stats, other, height };
  }

  function teamLayout(ctx, team, players) {
    const sorted = players.map((player, index) => ({ player, index })).sort((a, b) => {
      const aBr = Number(a.player.max_br), bBr = Number(b.player.max_br);
      const aMissing = a.player.max_br === null || a.player.max_br === undefined || !Number.isFinite(aBr);
      const bMissing = b.player.max_br === null || b.player.max_br === undefined || !Number.isFinite(bBr);
      return aMissing !== bMissing ? (aMissing ? 1 : -1) : aMissing ? a.index - b.index : bBr - aBr || a.index - b.index;
    }).map(item => item.player);
    const rows = sorted.map(player => playerLayout(ctx, player));
    return { team, rows, height: 70 + (rows.length ? rows.reduce((sum, row) => sum + row.height + 8, 0) : 66) + 12 };
  }

  function drawTeam(ctx, layout, x, y, highlightUid) {
    const blue = String(layout.team) === '1';
    const red = String(layout.team) === '2';
    const accent = blue ? COLORS.blue : red ? COLORS.red : COLORS.muted;
    const title = blue ? '蓝队' : red ? '红队' : `队伍 ${value(layout.team)}`;
    roundRect(ctx, x, y, PANEL_WIDTH, layout.height, 15, COLORS.panel);
    roundRect(ctx, x + 12, y + 12, PANEL_WIDTH - 24, 48, 8, blue ? '#203d54' : red ? '#4a3039' : '#344456');
    ctx.font = `700 25px ${FONT}`;
    ctx.fillStyle = accent;
    ctx.fillText(`${title} · ${layout.rows.length} 人`, x + 30, y + 44);
    let rowY = y + 70;
    if (!layout.rows.length) {
      ctx.font = `20px ${FONT}`;
      ctx.fillStyle = COLORS.muted;
      ctx.fillText('暂无玩家结算数据', x + 30, rowY + 35);
    }
    for (const row of layout.rows) {
      const selected = highlightUid !== null && String(row.player.uid) === highlightUid;
      roundRect(ctx, x + 14, rowY, PANEL_WIDTH - 28, row.height, 9, selected ? COLORS.highlight : COLORS.card);
      if (selected) roundRect(ctx, x + 14, rowY, 5, row.height, 2, COLORS.highlightLine);
      const left = x + 32;
      let textY = rowY + 29;
      ctx.font = `700 22px ${FONT}`;
      textY = drawLines(ctx, row.name, left, textY, 29, selected ? COLORS.gold : COLORS.text);
      ctx.font = `700 22px ${FONT}`;
      ctx.fillStyle = selected ? COLORS.gold : accent;
      ctx.textAlign = 'right';
      ctx.fillText(`BR ${rating(row.player.max_br)}`, x + PANEL_WIDTH - 32, rowY + 29);
      ctx.textAlign = 'left';
      textY += 7;
      ctx.font = `19px ${FONT}`;
      textY = drawLines(ctx, row.vehicles, left, textY, 25, COLORS.text);
      textY += 7;
      ctx.font = `18px ${FONT}`;
      textY = drawLines(ctx, row.stats, left, textY, 24, COLORS.text);
      textY += 5;
      ctx.font = `17px ${FONT}`;
      drawLines(ctx, row.other, left, textY, 23, COLORS.muted);
      rowY += row.height + 8;
    }
  }

  function metaLayout(ctx, label, text) {
    ctx.font = `22px ${FONT}`;
    const lines = wrap(ctx, text, (WIDTH - 2 * MARGIN - 2 * GAP) / 3 - 38);
    return { label, lines };
  }

  function render(data, highlightUid = null) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('浏览器无法创建图片画布。');
    const groups = new Map([[1, []], [2, []]]);
    for (const player of data.players || []) {
      const team = Number(player.team);
      if (!groups.has(team)) groups.set(team, []);
      groups.get(team).push(player);
    }
    const teams = [...groups].map(([team, players]) => teamLayout(ctx, team, players));
    const groupLabels = { aircraft: '空战', aviation: '空战', air: '空战', tank: '陆战', ground: '陆战', ship: '海战' };
    const modeLabels = { arcade: '街机', realistic: '历史', simulation: '全真' };
    const metadata = [
      metaLayout(ctx, '开始时间 (UTC)', value(data.start_utc)),
      metaLayout(ctx, '地图', value(data.map || data.level)),
      metaLayout(ctx, 'Session ID', value(data.sid)),
      metaLayout(ctx, '对局模式', `${value(groupLabels[data.battle_group] || data.battle_group)} · ${value(modeLabels[data.game_mode] || data.game_mode)}`),
      metaLayout(ctx, '对局权重', rating(data.match_br)),
      metaLayout(ctx, '数据来源', `${value(data.source)} · ${value(data.parts)} 段`),
    ];
    const metaHeight = [0, 3].map(start => Math.max(...metadata.slice(start, start + 3).map(item => 40 + item.lines.length * 29)) + 12);
    const teamsTop = 104 + metaHeight[0] + metaHeight[1] + 62;
    const teamRows = [];
    let totalTeamHeight = 0;
    for (let index = 0; index < teams.length; index += 2) {
      const height = Math.max(...teams.slice(index, index + 2).map(item => item.height));
      teamRows.push({ index, y: teamsTop + totalTeamHeight });
      totalTeamHeight += height + GAP;
    }
    canvas.width = WIDTH;
    canvas.height = teamsTop + totalTeamHeight + 18;
    ctx.fillStyle = COLORS.background;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = `700 34px ${FONT}`;
    ctx.fillStyle = COLORS.text;
    ctx.fillText('WTStat · 对局详情', MARGIN, 65);
    ctx.font = `18px ${FONT}`;
    ctx.fillStyle = COLORS.muted;
    ctx.textAlign = 'right';
    ctx.fillText('最终战绩 · 队内按权重从高到低', WIDTH - MARGIN, 60);
    ctx.textAlign = 'left';
    const metaWidth = (WIDTH - 2 * MARGIN - 2 * GAP) / 3;
    let metaY = 104;
    for (let row = 0; row < 2; row++) {
      const height = metaHeight[row] - 12;
      for (let column = 0; column < 3; column++) {
        const item = metadata[row * 3 + column];
        const x = MARGIN + column * (metaWidth + GAP);
        roundRect(ctx, x, metaY, metaWidth, height, 9, COLORS.card);

function battleLogHtml(log,kills,errors,players=[]){

  const vehicles=new Map(players.flatMap(p=>(p.configured||[]).filter(item=>item.code&&item.name).map(item=>[item.code,item.name])));

    if(!Array.isArray(kills))return '<p class="muted">本地 Replay 没有可用的逐条战斗日志。</p>';

    const rows=playerKills.map(e=>{const sec=Number(e.time_ms)/1000,time=Number.isFinite(sec)?`${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,'0')}`:'N/A';return `<tr><td class="stats">${time}</td><td title="${e.killer_uid?v(e.killer_uid):'—'}">${battlePlayer(e.killer_uid?e.killer_name||'—':'—',e.killer_uid,teams,eventVehicleName(e.attacker_vehicle_name,e.attacker_model,vehicles),e.attacker_model)}</td><td title="${e.weapon?v(e.weapon):'—'}">${v(e.weapon_name||e.weapon||'坠毁')}</td><td title="${v(e.victim_uid)}">${battlePlayer(e.victim_name,e.victim_uid,teams,eventVehicleName(e.target_vehicle_name,e.target_model,vehicles),e.target_model)}</td></tr>`}).join('');
    return `<details class="kill-events"><summary>旧版玩家击杀／坠毁记录 · ${playerKills.length} 条</summary><div class="kill-content"><p class="muted">本地 Replay 不在时保留旧缓存记录；只显示可对应玩家 UID 的死亡。</p><table><thead><tr><th>对局时间</th><th>来源</th><th>使用武器</th><th>目标</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
  }
  let killIndex=0;
  const playerEvents=log.filter(event=>event.event_type==='kill'&&event.target_kind==='player_unit'&&event.target_uid);
  const rows=log.map(event=>{
    const kill=event.event_type==='kill'&&Array.isArray(kills)?kills[killIndex++]:null;

    const sec=Number(event.time_ms)/1000;
    const time=Number.isFinite(sec)?`${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,'0')}`:'N/A';

    const detailHtml=event.weapon_name&&event.weapon_wiki_url?`<a href="${esc(event.weapon_wiki_url)}" target="_blank" rel="noopener" title="内部代码：${esc(event.weapon)}">${v(detail)}</a>`:`<span${event.weapon_name?` title="内部代码：${esc(event.weapon)}"`:''}>${v(detail)}</span>`;

    return `<tr><td class="stats">${time}</td><td>${v(crash?'坠毁':'玩家击杀')}</td><td title="${esc(sourceTitle)}">${battlePlayer(source,event.attacker_uid||kill?.killer_uid,teams,eventVehicleName(event.attacker_vehicle_name,event.attacker_model,vehicles),event.attacker_model)}</td><td>${detailHtml}</td><td title="${esc(targetTitle)}">${battlePlayer(target,event.target_uid,teams,eventVehicleName(event.target_vehicle_name,event.target_model,vehicles),event.target_model)}</td></tr>`;
  }).join('');
  const warnings=Array.isArray(errors)&&errors.length?`<p class="muted">解析警告 ${errors.length} 条；下载 JSON 可查看详情。</p>`:'';

async function saveBattleImage(){

  finally{button.disabled=false}
}
async function showDetail(sid){activeSession=sid;activeDetailData=null;highlightedPlayer=null;$('#saveBattleImage').classList.add('hidden');$('#imageStatus').textContent='';$('#results').classList.add('hidden');$('#detail').classList.remove('hidden');$('#detailBody').innerHTML='<p class="notice">正在按需读取对局详情；首次下载可能需要一些时间…</p>';try{const d=await api('/api/detail/'+encodeURIComponent(sid));markMatchCached(sid);highlightedPlayer=findQueriedPlayer(d.players,sid);activeDetailData=d;$('#saveBattleImage').classList.remove('hidden');const teams=[...new Set(d.players.map(p=>p.team))].sort();const groups=teams.map(t=>d.players.filter(p=>p.team===t));$('#detailBody').innerHTML=`<div class="meta"><div><strong>开始时间 (UTC)</strong>${v(d.start_utc)}</div><div><strong>地图</strong>${v(d.map||d.level)}</div><div><strong>Session ID</strong>${esc(d.sid)}</div><div><strong>对局模式</strong>${v(GROUP_LABELS[d.battle_group])} · ${v(MODE_LABELS[d.game_mode])}</div><div><strong>对局权重</strong>${brText(d.match_br)}</div><div><strong>数据来源</strong>${v(d.source)} · ${v(d.parts)} 段</div></div><p class="muted"><a href="https://warthunder.com/en/tournament/replay/${BigInt('0x'+d.sid)}" target="_blank" rel="noopener">官网对局页</a></p>${teams.map((t,i)=>table(t,groups[i],i)).join('')}${battleLogHtml(d.battle_log,d.kill_events,d.battle_log_errors,d.players)}`;const logDownload=$('#download-battle-log');if(logDownload)logDownload.onclick=()=>{const blob=new Blob([JSON.stringify({session_id:d.sid,start_time_utc:d.start_utc,events:d.battle_log,errors:d.battle_log_errors||[]},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`WTStat_${d.sid}_battle_log.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};const sortStates=groups.map(()=>({key:null,direction:-1}));$('#detailBody').querySelectorAll('.sort-button').forEach(button=>{button.onclick=()=>{const i=Number(button.dataset.teamIndex),key=button.dataset.sortKey,state=sortStates[i];state.direction=state.key===key?-state.direction:(key==='country'?1:-1);state.key=key;$(`#team-rows-${i}`).innerHTML=playerRows(sortPlayers(groups[i],key,state.direction));button.closest('thead').querySelectorAll('th[data-stat]').forEach(th=>{const active=th.dataset.stat===key;th.setAttribute('aria-sort',active?(state.direction<0?'descending':'ascending'):'none');th.querySelector('.sort-indicator').textContent=active?(state.direction<0?' ↓':' ↑'):''})}})}catch(e){$('#detailBody').innerHTML=`<p class="error">${esc(e.message)}</p>`}}

const TRASH_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg>';
function updateCacheMarks(sids){const removed=new Set(sids);for(const item of loadedMatches)if(removed.has(item.sid))item.cached=false;renderLoadedMatches();try{const saved=JSON.parse(sessionStorage.getItem('wtstat-list')||'null');if(Array.isArray(saved?.items)){for(const item of saved.items)if(removed.has(item.sid))item.cached=false;sessionStorage.setItem('wtstat-list',JSON.stringify(saved))}}catch{}}
function updateCacheMark(sid){updateCacheMarks([sid])}
let cachedItems=[],selectedCached=new Set(),cacheDeleting=false;
function visibleCachedItems(){const level=$('#cacheLevel').value;return cachedItems.filter(item=>!level||item.cache_level===level)}
function refreshCacheSelection(){const visible=visibleCachedItems(),chosen=visible.filter(item=>selectedCached.has(item.sid)).length,all=$('#cacheSelectAll');all.checked=!!visible.length&&chosen===visible.length;all.indeterminate=chosen>0&&chosen<visible.length;all.disabled=!visible.length||cacheDeleting;$('#deleteSelectedCache').disabled=!selectedCached.size||cacheDeleting;$('#cacheCount').textContent=`共 ${cachedItems.length} 场 · 当前显示 ${visible.length} 场 · 已选 ${selectedCached.size} 场`}
function renderCacheList(){const target=$('#cachedMatches');target.replaceChildren();const visible=visibleCachedItems();if(!visible.length){const empty=document.createElement('p');empty.className='muted cache-empty';empty.textContent=cachedItems.length?'当前筛选下没有战局。':'还没有已缓存战局。';target.append(empty)}for(const item of visible){const row=document.createElement('div');row.className='match-row';const check=document.createElement('input');check.type='checkbox';check.className='cache-row-select';check.checked=selectedCached.has(item.sid);check.setAttribute('aria-label',`选择战局 ${item.sid}`);check.onchange=()=>{if(check.checked)selectedCached.add(item.sid);else selectedCached.delete(item.sid);refreshCacheSelection()};const open=document.createElement('button');open.type='button';open.className='match';const when=document.createElement('span');when.textContent=item.start_utc?new Date(item.start_utc).toLocaleString('zh-CN',{timeZone:'UTC'})+' UTC':'时间 N/A';const id=document.createElement('small');id.textContent=item.sid;when.append(id);const summary=document.createElement('span');const map=document.createElement('b');map.textContent=item.map||'地图 N/A';const flags=document.createElement('small');flags.textContent=[item.cache_level==='complete'?'完全缓存':'部分缓存',item.detail?'详情':'',item.stats?'统计':'',item.replay_parts?`Replay ${item.replay_parts}${item.expected_parts?` / ${item.expected_parts}`:''} 段`:''].filter(Boolean).join(' · ');summary.append(map,flags);const mode=document.createElement('span');const groups={aircraft:'空战',tank:'陆战',ship:'海战'},modes={arcade:'街机',realistic:'历史',simulation:'全真'};mode.textContent=[groups[item.battle_group]||'',modes[item.game_mode]||''].filter(Boolean).join(' · ')||'模式 N/A';open.append(when,summary,mode);open.onclick=()=>{$('#cacheContents').classList.add('hidden');$('#showCache').setAttribute('aria-expanded','false');$('#showCache').textContent='显示已缓存战局';showDetail(item.sid)};const trash=document.createElement('button');trash.type='button';trash.className='cache-delete';trash.title=`删除战局 ${item.sid} 的本地缓存`;trash.setAttribute('aria-label',trash.title);trash.innerHTML=TRASH_ICON;trash.onclick=async()=>{if(!confirm(`删除战局 ${item.sid} 的本地 Replay 文件和解析缓存？过期文件可能无法重新下载。`))return;trash.disabled=true;try{await api('/api/cache/'+encodeURIComponent(item.sid),{method:'DELETE'});updateCacheMark(item.sid);await loadCacheList();$('#cachePanelStatus').textContent=`已删除战局 ${item.sid} 的本地缓存。`}catch(error){$('#cachePanelStatus').textContent='删除失败：'+error.message;$('#cachePanelStatus').className='error';trash.disabled=false}};row.append(check,open,trash);target.append(row)}refreshCacheSelection()}
async function loadCacheList(){const status=$('#cachePanelStatus');status.textContent='正在读取本地缓存…';try{const data=await api('/api/cache');cachedItems=data.items;const available=new Set(cachedItems.map(item=>item.sid));selectedCached=new Set([...selectedCached].filter(sid=>available.has(sid)));renderCacheList();status.textContent=data.total?'全选仅选择当前筛选结果；删除前会确认已选数量。':'';status.className='muted'}catch(error){status.textContent='读取缓存失败：'+error.message;status.className='error'}}
$('#cacheLevel').onchange=renderCacheList;
$('#cacheSelectAll').onchange=event=>{for(const item of visibleCachedItems()){if(event.target.checked)selectedCached.add(item.sid);else selectedCached.delete(item.sid)}renderCacheList()};
$('#deleteSelectedCache').onclick=async()=>{if(cacheDeleting||!selectedCached.size)return;const chosen=[...selectedCached];if(!confirm(`删除选中的 ${chosen.length} 场战局的 Replay 文件和解析缓存？过期文件可能无法重新下载。`))return;cacheDeleting=true;refreshCacheSelection();const status=$('#cachePanelStatus');status.textContent=`正在删除 ${chosen.length} 场战局…`;status.className='notice';try{const result=await api('/api/cache/selected',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessions:chosen})});updateCacheMarks(result.deleted);await loadCacheList();status.textContent=result.failed.length?`已删除 ${result.deleted.length} 场，${result.failed.length} 场失败：${result.failed.map(item=>item.sid).join('、')}`:`已删除 ${result.deleted.length} 场战局的本地缓存。`;status.className=result.failed.length?'error':'notice'}catch(error){await loadCacheList();status.textContent='批量删除失败：'+error.message;status.className='error'}finally{cacheDeleting=false;refreshCacheSelection()}};
$('#showCache').onclick=async()=>{const panel=$('#cacheContents'),opening=panel.classList.contains('hidden');panel.classList.toggle('hidden',!opening);$('#showCache').setAttribute('aria-expanded',String(opening));$('#showCache').textContent=opening?'收起已缓存战局':'显示已缓存战局';if(opening)await loadCacheList()};
$('#battleType').onchange=renderLoadedMatches;$('#battleMode').onchange=renderLoadedMatches;$('#searchForm').onsubmit=e=>{e.preventDefault();query=$('#q').value.trim();$('#detail').classList.add('hidden');$('#results').classList.remove('hidden');load(true)};
$('#saveBattleImage').onclick=saveBattleImage;$('#more').onclick=()=>load(false);$('#back').onclick=()=>{$('#detail').classList.add('hidden');$('#results').classList.remove('hidden')};check();loadSavedPlayers();const pageParams=new URLSearchParams(location.search),returnSession=pageParams.get('session');if(returnSession&&/^[0-9a-fA-F]{16}$/.test(returnSession)){if(!restoreListState(returnSession)){query=pageParams.get('q')||returnSession;$('#q').value=query;$('#start').value=pageParams.get('start')||'';$('#end').value=pageParams.get('end')||'';load(true)}showDetail(returnSession)}
</script></body></html>
