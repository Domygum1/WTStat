<header><h1>WTStat</h1><p>War Thunder Replay · 本地战绩查询 · <a href="/stats">统计</a> · <a href="/vehicles">载具资料表</a></p></header>
<main><section id="searchPanel"><h2>查询对局</h2><form id="searchForm" class="form"><div><label for="q">玩家昵称 / UID / Session ID</label><input id="q" required placeholder="输入昵称、UID 或 Session ID" autocomplete="off"></div><div><label for="start">开始日期 (UTC，可留空)</label><input id="start" type="date"></div><div><label for="end">结束日期 (UTC，可留空)</label><input id="end" type="date"></div><button type="submit">查询</button></form><p class="muted" id="status">正在检查配置…</p><div class="saved-panel"><div class="saved-column"><div class="saved-heading"><strong>最近查询</strong><small>最多 5 位玩家</small></div><div id="recentList" class="saved-list"></div></div><div class="saved-column"><div class="saved-heading"><strong>已关注</strong><small>长期保留</small></div><div id="favoriteList" class="saved-list"></div></div><p id="savedStatus" class="saved-status muted" aria-live="polite"></p></div></section>
<section id="results"><div class="row"><h2>对局列表</h2><div class="list-heading-actions"><span class="muted" id="listInfo">默认显示最近 15 场</span><button id="clearAllCache" class="cache-clear-all" type="button" title="删除所有本地对局缓存"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg>清除所有对局缓存</button></div></div><div class="match-filters"><label for="battleType">对局类型<select id="battleType"><option value="">全部</option><option value="air">空战</option><option value="ground">陆战</option><option value="naval">海战</option></select></label><label for="battleMode">模式<select id="battleMode"><option value="">全部</option><option value="arcade">街机</option><option value="realistic">历史</option><option value="simulation">全真</option></select></label></div><p id="filterNote" class="muted"></p><div id="message" class="muted">输入玩家昵称开始搜索；也可直接输入 Session ID 查看一场对局。</div><div id="matches" class="list"></div><p id="cacheStatus" class="muted" aria-live="polite"></p><button id="more" class="hidden" type="button">加载更多</button></section>
<section id="detail" class="hidden"><div class="row"><h2>对局详情</h2><button type="button" class="back" id="back">返回列表</button></div><div id="detailBody"></div></section></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'N/A').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v=x=>x===null||x===undefined||x===''?'N/A':esc(x);
let query='',offset=0,next=null,loading=false,activeSession=null,loadedMatches=[],officialTotal=null,highlightedPlayer=null;
async function api(url,options){const r=await fetch(url,options);let data;try{data=await r.json()}catch{throw Error('服务器响应格式错误')}if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:`HTTP ${r.status}`);return data}
async function check(){try{const d=await api('/api/status');$('#status').textContent=d.cookie_configured?'Cookie 已配置，可搜索昵称。输入 Session ID 无需 Cookie。':'昵称搜索需要 identity_sid；按 README 配置本地 Cookie。Session ID 可匿名查询。'}catch(e){$('#status').textContent=e.message}}
function savedMessage(text,error=false){$('#savedStatus').textContent=text;$('#savedStatus').className='saved-status '+(error?'error':'muted')}
function openSavedPlayer(value){$('#q').value=value;$('#start').value='';$('#end').value='';query=value;$('#detail').classList.add('hidden');$('#results').classList.remove('hidden');load(true)}
function savedEntry(item,isFavorite){const wrap=document.createElement('div');wrap.className='saved-entry';const open=document.createElement('button');open.type='button';open.className='saved-open';open.textContent=item.name&&item.name!==item.query?`${item.name} · ${item.query}`:item.query;open.title=`查询 ${item.query}`;open.onclick=()=>openSavedPlayer(item.query);const action=document.createElement('button');action.type='button';action.className='saved-action';action.textContent=isFavorite?'取消':item.followed?'★ 已关注':'☆ 关注';action.title=isFavorite?`取消关注 ${item.query}`:`关注 ${item.query}`;action.setAttribute('aria-label',action.title);if(!isFavorite&&item.followed){action.disabled=true}else{action.onclick=async()=>{try{await api('/api/favorites/'+encodeURIComponent(item.query),{method:isFavorite?'DELETE':'PUT'});savedMessage(isFavorite?'已取消关注。':`已关注 ${item.query}。`);await loadSavedPlayers()}catch(e){savedMessage(e.message,true)}}}wrap.append(open,action);return wrap}
async function loadSavedPlayers(){try{const [recent,favorites]=await Promise.all([api('/api/recent-players'),api('/api/favorites')]);for(const [selector,items,isFavorite,emptyText] of [['#recentList',recent.items,false,'完成一次玩家查询后会显示在这里。'],['#favoriteList',favorites.items,true,'还没有关注的玩家。']]){const list=$(selector);list.replaceChildren();if(items.length){for(const item of items)list.appendChild(savedEntry(item,isFavorite))}else{const empty=document.createElement('p');empty.className='saved-empty';empty.textContent=emptyText;list.appendChild(empty)}}}catch(e){savedMessage('读取本地玩家列表失败：'+e.message,true)}}
function setMessage(t,kind='muted'){$('#message').className=kind;$('#message').textContent=t}
function matchPassesFilters(m){if(!m.game_mode&&!m.vehicles)return true;const type=$('#battleType').value,mode=$('#battleMode').value,group=String(m.vehicles||'').toLowerCase();const groups={air:['aircraft','aviation','air'],ground:['tank','ground','ground_vehicles'],naval:['ship','ships','fleet','naval','boat']};return (!type||groups[type]?.includes(group))&&(!mode||m.game_mode===mode)}
function renderLoadedMatches(){const filtered=!!($('#battleType').value||$('#battleMode').value),visible=loadedMatches.filter(matchPassesFilters);$('#matches').replaceChildren();visible.forEach(renderMatch);$('#listInfo').textContent=`已显示 ${visible.length} 场${filtered?` · 已加载 ${loadedMatches.length} 场`:''}${officialTotal===null?'':` · 官网共 ${officialTotal} 场`}`;$('#filterNote').textContent=!filtered?'':visible.length?'仅筛选已加载的对局；点击“加载更多”继续查找更早的对局。':next===null?'已加载的对局中没有符合条件的。':'已加载的对局中没有符合条件的；可点击“加载更多”继续查找。'}
function renderMatch(m){const row=document.createElement('div');row.className='match-row';const b=document.createElement('button');b.type='button';b.className='match';b.innerHTML=`<span>${v(m.date_text)}<br><span class="small">官网时间 · UTC</span></span><span><b>${v(m.map||m.title)}</b><br><span class="small">${v(m.game_type)} · ${v(m.game_mode)} · ${v(m.duration)}</span>${m.cached?'<span class="cache-badge">本地缓存</span>':''}</span><span class="tag">查看详情 →</span>`;b.onclick=()=>{saveListState(m.sid);showDetail(m.sid)};row.appendChild(b);if(m.cached){const trash=document.createElement('button');trash.type='button';trash.className='cache-delete';trash.title='删除这场对局的本地缓存';trash.setAttribute('aria-label',trash.title);trash.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg>';trash.onclick=async()=>{if(!confirm('删除这场对局的本地 Replay 文件和解析缓存？如果官网文件已过期，可能无法重新下载。'))return;trash.disabled=true;try{await api('/api/cache/'+encodeURIComponent(m.sid),{method:'DELETE'});m.cached=false;row.querySelector('.cache-badge')?.remove();trash.remove();$('#cacheStatus').textContent='已删除这场对局的本地缓存。';$('#cacheStatus').className='notice';try{const saved=JSON.parse(sessionStorage.getItem('wtstat-list')||'null');if(Array.isArray(saved?.items)){for(const item of saved.items)if(item.sid===m.sid)item.cached=false;sessionStorage.setItem('wtstat-list',JSON.stringify(saved))}}catch{}}catch(e){$('#cacheStatus').textContent='删除缓存失败：'+e.message;$('#cacheStatus').className='error';trash.disabled=false}};row.appendChild(trash)}$('#matches').appendChild(row)}
function markMatchCached(sid){let changed=false;for(const item of loadedMatches)if(item.sid===sid&&!item.cached){item.cached=true;changed=true}if(changed)renderLoadedMatches();try{const saved=JSON.parse(sessionStorage.getItem('wtstat-list')||'null');if(Array.isArray(saved?.items)){for(const item of saved.items)if(item.sid===sid)item.cached=true;sessionStorage.setItem('wtstat-list',JSON.stringify(saved))}}catch{}}
function saveListState(sid){if(!query||!loadedMatches.length)return;try{sessionStorage.setItem('wtstat-list',JSON.stringify({sid,query,start:$('#start').value,end:$('#end').value,items:loadedMatches,offset,next,total:officialTotal,battleType:$('#battleType').value,battleMode:$('#battleMode').value,message:$('#message').textContent,messageClass:$('#message').className}))}catch{}}
function restoreListState(sid){try{const state=JSON.parse(sessionStorage.getItem('wtstat-list')||'null');if(state?.sid!==sid||!state.query||!Array.isArray(state.items))return false;query=state.query;$('#q').value=query;$('#start').value=state.start||'';$('#end').value=state.end||'';$('#battleType').value=state.battleType||'';$('#battleMode').value=state.battleMode||'';loadedMatches=state.items;offset=state.offset||0;next=state.next??null;officialTotal=state.total??null;renderLoadedMatches();$('#more').classList.toggle('hidden',next===null);$('#message').textContent=state.message||'';$('#message').className=state.messageClass||'muted';return true}catch{return false}}
async function load(reset=false){if(loading)return;loading=true;const button=$('#more');button.disabled=true;if(reset){offset=0;next=null;officialTotal=null;loadedMatches=[];$('#matches').replaceChildren();$('#cacheStatus').textContent='';setMessage('正在读取官网列表…','notice')}try{const params=new URLSearchParams({q:query,offset});if($('#start').value)params.set('start',$('#start').value);if($('#end').value)params.set('end',$('#end').value);const d=await api('/api/search?'+params);if(d.mode!=='session'&&typeof d.total!=='number')throw Error('当前连接的是旧版 WTStat 服务。请运行更新后的 start.bat，并打开 http://127.0.0.1:8766');loadedMatches.push(...d.items);next=d.next_offset;officialTotal=typeof d.total==='number'?d.total:null;renderLoadedMatches();button.classList.toggle('hidden',next===null);const filtered=$('#start').value||$('#end').value;setMessage(d.items.length?d.note||'':d.total&&filtered?'官网有对局，但当前日期筛选没有命中这一页。请清空日期后查询，或继续加载更多。':(next===null?'没有找到对局。':'这一页没有对局，可继续加载。'));offset=next??offset}catch(e){setMessage(e.message,'error');button.classList.add('hidden')}finally{button.disabled=false;loading=false;if(reset)loadSavedPlayers()}}
function vehicleHref(code){const params=new URLSearchParams({id:code});if(activeSession)params.set('session',activeSession);if(query)params.set('q',query);if($('#start').value)params.set('start',$('#start').value);if($('#end').value)params.set('end',$('#end').value);return '/vehicles?'+params}
function vehicleCells(items){return items?.length?items.map(x=>x.code?`<a class="pill" href="${esc(vehicleHref(x.code))}" title="查看载具资料">${esc(x.name)}</a>`:`<span class="pill">${esc(x.name)}</span>`).join(''):'N/A'}
function lineupCountry(player){const countries=[...new Set((player.configured||[]).map(x=>x.country).filter(x=>x&&x!=='N/A'))];return countries.length===1?countries[0]:null}
const FLAG_CODES={'美国':'us','德国':'de','苏联':'su','英国':'gb','日本':'jp','意大利':'it','法国':'fr','瑞典':'se','中国':'cn','以色列':'il'};
function countryFlag(player){const country=lineupCountry(player),code=FLAG_CODES[country];return code?`<img class="country-flag" src="/flags/${code}.svg" alt="${esc(country)}" title="${esc(country)}">`:v(country)}
function aiDisplay(p){const values=[p.aiKills,p.aiGroundKills,p.aiNavalKills];if(values.some(x=>x===null||x===undefined||x===''))return 'AI N/A';const counts=values.map(Number);if(counts.some(x=>!Number.isFinite(x)))return 'AI N/A';const total=counts.reduce((a,b)=>a+b,0),parts=['空中','地面','海上'].map((name,i)=>counts[i]>0?`${name} ${counts[i]}`:null).filter(Boolean);return `AI ${total}${parts.length?`（${parts.join(' · ')}）`:''}`}
function sortPlayers(players,key,direction){if(!key)return players;return players.map((player,index)=>({player,index})).sort((a,b)=>{if(key==='country'){const ac=lineupCountry(a.player),bc=lineupCountry(b.player);if(!ac||!bc)return ac? -1:bc?1:a.index-b.index;return ac.localeCompare(bc,'zh-CN')*direction||a.index-b.index}const av=Number(a.player[key]),bv=Number(b.player[key]);const am=a.player[key]===null||a.player[key]===undefined||!Number.isFinite(av),bm=b.player[key]===null||b.player[key]===undefined||!Number.isFinite(bv);if(am!==bm)return am?1:-1;return (am?0:(av-bv)*direction)||a.index-b.index}).map(x=>x.player)}
const GROUP_LABELS={aircraft:'空战',aviation:'空战',air:'空战',tank:'陆战',ground:'陆战',ground_vehicles:'陆战',ship:'海战',ships:'海战',fleet:'海战',naval:'海战',boat:'海战'};
const MODE_LABELS={arcade:'街机',realistic:'历史',simulation:'全真'};
function brText(value){const number=Number(value);return value===null||value===undefined||!Number.isFinite(number)?'N/A':number.toFixed(1)}
function findQueriedPlayer(players,sid){const value=query.trim().toLocaleLowerCase();if(!value||value===sid.toLowerCase()||/^\d{15,20}$/.test(value)&&BigInt(value)===BigInt('0x'+sid))return null;const byUid=players.find(p=>String(p.uid??'')===value);if(byUid)return byUid;const exact=players.filter(p=>String(p.name??'').toLocaleLowerCase()===value);if(exact.length===1)return exact[0];const partial=players.filter(p=>String(p.name??'').toLocaleLowerCase().includes(value));return partial.length===1?partial[0]:null}
function playerRows(players){return players.map(p=>`<tr class="${p===highlightedPlayer?'queried-player':''}"><td><span class="player-id" title="UID：${v(p.uid)}">${v(p.name)}</span></td><td>${countryFlag(p)}</td><td class="stats" title="按本场对局模式计算的载具最高权重">${brText(p.max_br)}</td><td>${vehicleCells(p.configured)}</td><td class="stats">${v(p.kills)}</td><td class="stats">${v(p.groundKills)}</td><td class="stats">${v(p.deaths)}</td><td class="stats">${v(p.assists)}</td><td class="stats">${v(p.score)}</td><td class="small">${aiDisplay(p)} · 占点 ${v(p.captureZone)} · 击杀队友 ${v(p.teamKills)}</td></tr>`).join('')}
function teamColor(team){return String(team)==='1'?'blue':String(team)==='2'?'red':''}
function battlePlayer(name,uid,teams,vehicleName,vehicleCode){const color=name&&name!=='—'?teams.get(String(uid))||'':'';const player=`<span${color?` class="team-name ${color}"`:''}>${v(name)}</span>`;if(!uid||!name||name==='—')return player;return `${player}<span class="vehicle-after-name"${vehicleCode?` title="载具代码：${esc(vehicleCode)}"`:''}>（${v(vehicleName)}）</span>`}
function eventVehicleName(name,model,vehicles){if(name)return name;if(!model)return null;const code=model.startsWith('tankModels/')?model.slice(11):model;return vehicles.get(code)||code}
function table(team,players,index){const sortHead=(key,label)=>`<th data-stat="${key}" aria-sort="none"><button type="button" class="sort-button" data-team-index="${index}" data-sort-key="${key}" title="点击排序，再次点击切换方向">${label}<span class="sort-indicator"></span></button></th>`;const color=teamColor(team),name=color==='blue'?'蓝队':color==='red'?'红队':`队伍 ${esc(team)}`;return `<div class="team${color?` team-${color}`:''}"><h3>${name} · ${players.length} 人</h3><table><thead><tr><th>玩家</th>${sortHead('country','队列国籍')}${sortHead('max_br','权重')}<th title="陆战、空战、直升机、海战；同类按本局权重从高到低">载具</th>${sortHead('kills','空中击杀')}${sortHead('groundKills','地面击杀')}${sortHead('deaths','死亡')}${sortHead('assists','助攻')}${sortHead('score','得分')}<th>其他</th></tr></thead><tbody id="team-rows-${index}">${playerRows(players)}</tbody></table></div>`}
function battleLogHtml(log,kills,errors,players=[]){
  const teams=new Map(players.filter(p=>p.uid!==null&&p.uid!==undefined).map(p=>[String(p.uid),teamColor(p.team)]));
  const vehicles=new Map(players.flatMap(p=>(p.configured||[]).filter(item=>item.code&&item.name).map(item=>[item.code,item.name])));
  if(!Array.isArray(log)){
    if(!Array.isArray(kills))return '<p class="muted">本地 Replay 没有可用的逐条战斗日志。</p>';
    const playerKills=kills.filter(e=>e.victim_uid);
    const rows=playerKills.map(e=>{const sec=Number(e.time_ms)/1000,time=Number.isFinite(sec)?`${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,'0')}`:'N/A';return `<tr><td class="stats">${time}</td><td title="${e.killer_uid?v(e.killer_uid):'—'}">${battlePlayer(e.killer_uid?e.killer_name||'—':'—',e.killer_uid,teams,eventVehicleName(e.attacker_vehicle_name,e.attacker_model,vehicles),e.attacker_model)}</td><td title="${e.weapon?v(e.weapon):'—'}">${v(e.weapon_name||e.weapon||'坠毁')}</td><td title="${v(e.victim_uid)}">${battlePlayer(e.victim_name,e.victim_uid,teams,eventVehicleName(e.target_vehicle_name,e.target_model,vehicles),e.target_model)}</td></tr>`}).join('');
    return `<details class="kill-events"><summary>旧版玩家击杀／坠毁记录 · ${playerKills.length} 条</summary><div class="kill-content"><p class="muted">本地 Replay 不在时保留旧缓存记录；只显示可对应玩家 UID 的死亡。</p><table><thead><tr><th>对局时间</th><th>来源</th><th>使用武器</th><th>目标</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
  }
  let killIndex=0;
  const playerEvents=log.filter(event=>event.event_type==='kill'&&event.target_kind==='player_unit'&&event.target_uid);
  const rows=log.map(event=>{
    const kill=event.event_type==='kill'&&Array.isArray(kills)?kills[killIndex++]:null;
    if(event.event_type!=='kill'||event.target_kind!=='player_unit'||!event.target_uid)return '';
    const crash=!event.attacker_uid||!event.weapon;
    const sec=Number(event.time_ms)/1000;
    const time=Number.isFinite(sec)?`${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,'0')}`:'N/A';
    const source=event.attacker_uid||kill?.killer_uid?event.attacker_name||kill?.killer_name||'—':'—';
    const target=kill?.victim_name||event.target_name||event.target_model||'—';
    const detail=event.weapon_name||event.weapon||(crash?'坠毁':'未记录武器');
    const detailHtml=event.weapon_name&&event.weapon_wiki_url?`<a href="${esc(event.weapon_wiki_url)}" target="_blank" rel="noopener" title="内部代码：${esc(event.weapon)}">${v(detail)}</a>`:`<span${event.weapon_name?` title="内部代码：${esc(event.weapon)}"`:''}>${v(detail)}</span>`;
    const sourceTitle=event.attacker_uid?`玩家 UID ${event.attacker_uid}`:'';
    const targetTitle=[event.target_uid?`玩家 UID ${event.target_uid}`:event.weapon_owner_uid?`武器持有者 UID ${event.weapon_owner_uid}`:event.target_entity_uid!==null&&event.target_entity_uid!==undefined?`实体 #${event.target_entity_uid}`:'',event.target_model?`目标载具 ${event.target_model}`:''].filter(Boolean).join(' · ');
    return `<tr><td class="stats">${time}</td><td>${v(crash?'坠毁':'玩家击杀')}</td><td title="${esc(sourceTitle)}">${battlePlayer(source,event.attacker_uid||kill?.killer_uid,teams,eventVehicleName(event.attacker_vehicle_name,event.attacker_model,vehicles),event.attacker_model)}</td><td>${detailHtml}</td><td title="${esc(targetTitle)}">${battlePlayer(target,event.target_uid,teams,eventVehicleName(event.target_vehicle_name,event.target_model,vehicles),event.target_model)}</td></tr>`;
  }).join('');
  const warnings=Array.isArray(errors)&&errors.length?`<p class="muted">解析警告 ${errors.length} 条；下载 JSON 可查看详情。</p>`:'';
  return `<details class="kill-events"><summary>玩家击杀／坠毁 · ${playerEvents.length} 条</summary><div class="kill-content">${warnings}<p class="muted">只显示能对应玩家 UID 的死亡；没有来源显示横线，已归属的击杀保留玩家姓名。下载的 JSON 仍包含完整解析日志。</p><div class="log-controls"><button class="back" id="download-battle-log" type="button">下载完整日志 JSON</button></div><table><thead><tr><th>对局时间</th><th>事件</th><th>来源</th><th>使用武器</th><th>目标</th></tr></thead><tbody id="battle-log-rows">${rows}</tbody></table></div></details>`;
}
async function showDetail(sid){activeSession=sid;highlightedPlayer=null;$('#results').classList.add('hidden');$('#detail').classList.remove('hidden');$('#detailBody').innerHTML='<p class="notice">正在按需读取对局详情；首次下载可能需要一些时间…</p>';try{const d=await api('/api/detail/'+encodeURIComponent(sid));markMatchCached(sid);highlightedPlayer=findQueriedPlayer(d.players,sid);const teams=[...new Set(d.players.map(p=>p.team))].sort();const groups=teams.map(t=>d.players.filter(p=>p.team===t));$('#detailBody').innerHTML=`<div class="meta"><div><strong>开始时间 (UTC)</strong>${v(d.start_utc)}</div><div><strong>地图</strong>${v(d.map||d.level)}</div><div><strong>Session ID</strong>${esc(d.sid)}</div><div><strong>对局模式</strong>${v(GROUP_LABELS[d.battle_group])} · ${v(MODE_LABELS[d.game_mode])}</div><div><strong>对局权重</strong>${brText(d.match_br)}</div><div><strong>数据来源</strong>${v(d.source)} · ${v(d.parts)} 段</div></div><p class="muted"><a href="https://warthunder.com/en/tournament/replay/${BigInt('0x'+d.sid)}" target="_blank" rel="noopener">官网对局页</a></p>${teams.map((t,i)=>table(t,groups[i],i)).join('')}${battleLogHtml(d.battle_log,d.kill_events,d.battle_log_errors,d.players)}`;const logDownload=$('#download-battle-log');if(logDownload)logDownload.onclick=()=>{const blob=new Blob([JSON.stringify({session_id:d.sid,start_time_utc:d.start_utc,events:d.battle_log,errors:d.battle_log_errors||[]},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`WTStat_${d.sid}_battle_log.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};const sortStates=groups.map(()=>({key:null,direction:-1}));$('#detailBody').querySelectorAll('.sort-button').forEach(button=>{button.onclick=()=>{const i=Number(button.dataset.teamIndex),key=button.dataset.sortKey,state=sortStates[i];state.direction=state.key===key?-state.direction:(key==='country'?1:-1);state.key=key;$(`#team-rows-${i}`).innerHTML=playerRows(sortPlayers(groups[i],key,state.direction));button.closest('thead').querySelectorAll('th[data-stat]').forEach(th=>{const active=th.dataset.stat===key;th.setAttribute('aria-sort',active?(state.direction<0?'descending':'ascending'):'none');th.querySelector('.sort-indicator').textContent=active?(state.direction<0?' ↓':' ↑'):''})}})}catch(e){$('#detailBody').innerHTML=`<p class="error">${esc(e.message)}</p>`}}
$('#battleType').onchange=renderLoadedMatches;$('#battleMode').onchange=renderLoadedMatches;$('#searchForm').onsubmit=e=>{e.preventDefault();query=$('#q').value.trim();$('#detail').classList.add('hidden');$('#results').classList.remove('hidden');load(true)};
$('#clearAllCache').onclick=async()=>{if(loading)return;if(!confirm('删除全部已下载的 Replay 文件和解析结果？对局列表会保留。过期的 Replay 可能无法重新下载。'))return;const button=$('#clearAllCache');button.disabled=true;$('#cacheStatus').textContent='正在清除 Replay 缓存…';$('#cacheStatus').className='notice';try{const result=await api('/api/cache',{method:'DELETE'});for(const item of loadedMatches)item.cached=false;renderLoadedMatches();try{const saved=JSON.parse(sessionStorage.getItem('wtstat-list')||'null');if(Array.isArray(saved?.items)){for(const item of saved.items)item.cached=false;sessionStorage.setItem('wtstat-list',JSON.stringify(saved))}}catch{}$('#cacheStatus').textContent=`已清除 ${result.replay_sessions} 场 Replay（${result.replay_parts} 段）和 ${result.matches} 场解析结果；对局列表已保留。`}catch(error){$('#cacheStatus').textContent='清除失败：'+error.message;$('#cacheStatus').className='error'}finally{button.disabled=false}};$('#more').onclick=()=>load(false);$('#back').onclick=()=>{$('#detail').classList.add('hidden');$('#results').classList.remove('hidden')};check();loadSavedPlayers();const pageParams=new URLSearchParams(location.search),returnSession=pageParams.get('session');if(returnSession&&/^[0-9a-fA-F]{16}$/.test(returnSession)){if(!restoreListState(returnSession)){query=pageParams.get('q')||returnSession;$('#q').value=query;$('#start').value=pageParams.get('start')||'';$('#end').value=pageParams.get('end')||'';load(true)}showDetail(returnSession)}
</script></body></html>
